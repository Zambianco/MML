<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#121212">
    <title>{% block title %}My Music Library{% endblock %}</title>
    <link rel="manifest" href="{% url 'pwa-manifest' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        :root {
            --app-bg-primary: #121212;
            --app-bg-secondary: #1a1a1a;
            --app-bg-card: #181818;
            --app-bg-card-hover: #282828;
            --app-text-primary: #ffffff;
            --app-text-secondary: #b3b3b3;
            --app-text-muted: #7a7a7a;
            --app-accent: #1ed760;
            --app-accent-hover: #3be477;
            --app-accent-dim: rgba(30, 215, 96, 0.15);
            --app-border: rgba(255, 255, 255, 0.08);
            --app-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            --app-radius: 0.75rem;
            --app-sidebar-w: 232px;
        }

        html,
        body {
            height: 100%;
        }

        body.app-shell,
        body.auth-shell {
            font-family: "Inter", sans-serif;
            background:
                linear-gradient(180deg, rgba(30, 215, 96, 0.07), transparent 320px),
                var(--app-bg-primary);
            color: var(--app-text-primary);
            min-height: 100vh;
        }

        body.app-shell .navbar,
        body.auth-shell .navbar {
            background: #000 !important;
            backdrop-filter: blur(20px);
            border-bottom-color: var(--app-border) !important;
        }

        body.app-shell .navbar .navbar-text,
        body.auth-shell .navbar .navbar-text {
            color: var(--app-text-secondary) !important;
        }

        body.app-shell .container,
        body.auth-shell .container {
            position: relative;
            z-index: 1;
        }

        body.app-shell .card,
        body.auth-shell .card {
            background: var(--app-bg-card);
            border: 1px solid var(--app-border) !important;
            box-shadow: var(--app-shadow) !important;
            color: var(--app-text-primary);
            border-radius: var(--app-radius);
        }

        body.app-shell .list-group-item,
        body.auth-shell .list-group-item {
            background: transparent;
            color: var(--app-text-primary);
            border-color: var(--app-border);
        }

        body.app-shell .border,
        body.auth-shell .border,
        body.app-shell .rounded,
        body.auth-shell .rounded {
            border-color: var(--app-border) !important;
        }

        body.app-shell .text-secondary,
        body.auth-shell .text-secondary,
        body.app-shell .small,
        body.auth-shell .small {
            color: var(--app-text-secondary) !important;
        }

        body.app-shell .text-danger,
        body.auth-shell .text-danger {
            color: #ff9f93 !important;
        }

        body.app-shell .form-control,
        body.app-shell .form-select,
        body.auth-shell .form-control,
        body.auth-shell .form-select {
            background: var(--app-bg-secondary);
            color: var(--app-text-primary);
            border-color: var(--app-border);
        }

        body.app-shell .form-control:focus,
        body.app-shell .form-select:focus,
        body.auth-shell .form-control:focus,
        body.auth-shell .form-select:focus {
            background: var(--app-bg-secondary);
            color: var(--app-text-primary);
            border-color: rgba(30, 215, 96, 0.5);
            box-shadow: 0 0 0 0.25rem rgba(30, 215, 96, 0.15);
        }

        body.app-shell .form-check-input,
        body.auth-shell .form-check-input {
            background-color: var(--app-bg-secondary);
            border-color: var(--app-border);
        }

        body.app-shell .form-check-input:checked,
        body.auth-shell .form-check-input:checked {
            background-color: var(--app-accent);
            border-color: var(--app-accent);
        }

        body.app-shell .btn,
        body.auth-shell .btn {
            border-radius: 999px;
            font-weight: 600;
        }

        body.app-shell .btn-dark,
        body.auth-shell .btn-dark {
            background: var(--app-accent);
            border-color: var(--app-accent);
            color: #000;
        }

        body.app-shell .btn-dark:hover,
        body.app-shell .btn-dark:focus,
        body.auth-shell .btn-dark:hover,
        body.auth-shell .btn-dark:focus {
            background: var(--app-accent-hover);
            border-color: var(--app-accent-hover);
            color: #000;
        }

        body.app-shell .btn-outline-dark,
        body.app-shell .btn-outline-secondary,
        body.auth-shell .btn-outline-dark,
        body.auth-shell .btn-outline-secondary {
            color: var(--app-text-primary);
            border-color: var(--app-border);
            background: transparent;
        }

        body.app-shell .btn-outline-dark:hover,
        body.app-shell .btn-outline-dark:focus,
        body.app-shell .btn-outline-secondary:hover,
        body.app-shell .btn-outline-secondary:focus,
        body.auth-shell .btn-outline-dark:hover,
        body.auth-shell .btn-outline-dark:focus,
        body.auth-shell .btn-outline-secondary:hover,
        body.auth-shell .btn-outline-secondary:focus {
            color: var(--app-text-primary);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.16);
        }

        body.app-shell .table,
        body.auth-shell .table {
            --bs-table-bg: transparent;
            --bs-table-color: var(--app-text-primary);
            --bs-table-border-color: var(--app-border);
            --bs-table-striped-color: var(--app-text-primary);
            --bs-table-striped-bg: rgba(255, 255, 255, 0.02);
            --bs-table-hover-color: var(--app-text-primary);
            --bs-table-hover-bg: rgba(255, 255, 255, 0.03);
        }

        body.app-shell thead th,
        body.auth-shell thead th {
            color: var(--app-text-secondary);
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        body.app-shell .table-responsive,
        body.auth-shell .table-responsive {
            border: 1px solid var(--app-border);
            border-radius: var(--app-radius);
        }

        body.app-shell .link-dark,
        body.auth-shell .link-dark {
            color: var(--app-text-primary) !important;
        }

        body.app-shell .link-dark:hover,
        body.auth-shell .link-dark:hover {
            color: var(--app-accent) !important;
        }

        body.app-shell .progress,
        body.auth-shell .progress {
            background: rgba(255, 255, 255, 0.08);
        }

        body.app-shell .progress-bar.bg-dark,
        body.auth-shell .progress-bar.bg-dark {
            background: linear-gradient(90deg, var(--app-accent), var(--app-accent-hover)) !important;
            color: #000;
        }

        body.app-shell .alert,
        body.auth-shell .alert {
            border-color: var(--app-border);
        }

        body.app-shell .alert-info,
        body.auth-shell .alert-info {
            background: rgba(79, 140, 255, 0.12);
            color: #c7d7ff;
        }

        body.app-shell .alert-success,
        body.auth-shell .alert-success {
            background: rgba(72, 187, 120, 0.12);
            color: #c4f0d2;
        }

        body.app-shell .alert-danger,
        body.auth-shell .alert-danger {
            background: rgba(231, 76, 60, 0.12);
            color: #ffd0cb;
        }

        body.app-shell .badge.text-bg-light,
        body.auth-shell .badge.text-bg-light {
            background: rgba(255, 255, 255, 0.08) !important;
            color: var(--app-text-primary) !important;
        }

        body.app-shell .app-page,
        body.auth-shell .auth-page {
            padding-top: 1.5rem;
            padding-bottom: 2rem;
        }

        body.app-shell .page-kicker,
        body.auth-shell .page-kicker {
            color: var(--app-accent) !important;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-size: 0.74rem;
            font-weight: 600;
        }

        .app-sidebar {
            position: fixed;
            inset: 0 auto 0 0;
            width: var(--app-sidebar-w);
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            padding: 1.5rem 0.75rem;
            background: #000;
            border-right: 1px solid var(--app-border);
        }

        .app-brand {
            color: var(--app-text-primary);
            font-weight: 800;
            font-size: 1.35rem;
            letter-spacing: -0.02em;
            text-decoration: none;
            padding: 0 0.75rem;
        }

        .app-brand::before {
            content: "";
            display: inline-block;
            width: 0.7rem;
            height: 0.7rem;
            margin-right: 0.5rem;
            border-radius: 50%;
            background: var(--app-accent);
        }

        .app-tabs {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .app-tab {
            color: var(--app-text-secondary);
            border-radius: 0.5rem;
            padding: 0.65rem 0.75rem;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
            transition: color 0.15s, background 0.15s;
        }

        .app-tab:hover,
        .app-tab:focus {
            color: var(--app-text-primary);
            background: rgba(255, 255, 255, 0.06);
        }

        .app-tab.active {
            color: var(--app-text-primary);
            background: var(--app-bg-card-hover);
            box-shadow: inset 3px 0 0 var(--app-accent);
        }

        .app-user {
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            padding: 0 0.75rem;
        }

        .app-main {
            margin-left: var(--app-sidebar-w);
        }

        body:has(.player-shell) .app-main {
            margin-left: 0;
        }

        body:has(.player-shell) .app-sidebar {
            display: none;
        }

        .app-page-header {
            display: flex;
            flex-wrap: wrap;
            align-items: end;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .app-stat {
            padding: 1rem;
        }

        .app-stat-label {
            color: var(--app-text-secondary);
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .app-stat-value {
            margin-top: 0.25rem;
            font-size: clamp(1.75rem, 4vw, 2.5rem);
            line-height: 1;
            font-weight: 700;
        }

        .section-tabs {
            border-bottom: 1px solid var(--app-border);
            gap: 0.25rem;
        }

        .section-tabs .nav-link {
            color: var(--app-text-secondary);
            border: 0;
            border-bottom: 2px solid transparent;
            border-radius: 0;
            font-weight: 600;
        }

        .section-tabs .nav-link:hover,
        .section-tabs .nav-link:focus {
            color: var(--app-text-primary);
            border-bottom-color: rgba(255, 255, 255, 0.16);
        }

        .section-tabs .nav-link.active {
            color: var(--app-accent);
            background: transparent;
            border-bottom-color: var(--app-accent);
        }

        .dashboard-panel {
            border: 1px solid var(--app-border);
            border-radius: var(--app-radius);
            background: rgba(255, 255, 255, 0.025);
            padding: 1rem;
        }

        .audio-inline {
            max-width: 300px;
        }

        @media (max-width: 768px) {
            .app-sidebar {
                inset: auto 0 0 0;
                width: 100%;
                flex-direction: row;
                align-items: center;
                gap: 0;
                padding: 0.35rem 0.5rem;
                border-right: 0;
                border-top: 1px solid var(--app-border);
            }

            .app-brand,
            .app-user {
                display: none;
            }

            .app-tabs {
                flex-direction: row;
                width: 100%;
                justify-content: space-around;
            }

            .app-tab {
                font-size: 0.75rem;
                padding: 0.5rem 0.4rem;
                text-align: center;
            }

            .app-tab.active {
                box-shadow: inset 0 -3px 0 var(--app-accent);
            }

            .app-main {
                margin-left: 0;
                padding-bottom: 4rem;
            }
        }
    </style>
    {% block extra_head %}{% endblock %}
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="{% block body_class %}app-shell{% endblock %}">
    {% if request.user.is_authenticated %}
        <nav class="navbar app-sidebar">
            <a class="app-brand" href="{% url 'home' %}">MML</a>
            <div class="app-tabs" role="navigation" aria-label="Navegacao principal">
                <a class="app-tab {% if request.resolver_match.url_name == 'downloads-player' %}active{% endif %}" href="{% url 'downloads-player' %}">Reproducao</a>
                <a class="app-tab {% if request.resolver_match.url_name == 'library-dashboard' %}active{% endif %}" href="{% url 'library-dashboard' %}">Biblioteca</a>
                <a class="app-tab {% if request.resolver_match.url_name == 'downloads-files' %}active{% endif %}" href="{% url 'downloads-files' %}">Arquivos</a>
                <a class="app-tab {% if request.resolver_match.url_name == 'downloads-import-list' or request.resolver_match.url_name == 'downloads-import-detail' %}active{% endif %}" href="{% url 'downloads-import-list' %}">Importacoes</a>
                <a class="app-tab {% if request.resolver_match.url_name == 'api-index' %}active{% endif %}" href="{% url 'api-index' %}">API</a>
            </div>
            <div class="app-user">
                <span class="text-secondary small">{{ request.user.get_username }}</span>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="btn btn-outline-dark btn-sm" type="submit">Sair</button>
                </form>
            </div>
        </nav>
    {% endif %}
    <div class="app-main">
    {% block content %}{% endblock %}
    </div>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("{% url 'service-worker' %}").catch(() => {});
            });
        }
    </script>
</body>
</html>
