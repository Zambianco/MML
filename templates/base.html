<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}My Music Library{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}bg-light{% endblock %}">
    {% if request.user.is_authenticated %}
        <nav class="navbar navbar-light bg-white border-bottom">
            <div class="container">
                <span class="navbar-text text-secondary small">
                    {{ request.user.get_username }}
                </span>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="btn btn-outline-dark btn-sm" type="submit">Sair</button>
                </form>
            </div>
        </nav>
    {% endif %}
    {% block content %}{% endblock %}
</body>
</html>
