server {
    listen 80;
    server_name localhost;

    location /health/ {
        access_log off;
        return 200 "healthy\n";
    }

    location /mml/static/ {
        alias /app/staticfiles/;
    }

    # Escuta na rota /mml
    location /mml/ {
        proxy_pass http://web:8000/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Avisa ao Django qual era o prefixo original da URL do usuário
        proxy_set_header SCRIPT_NAME /mml;
        proxy_set_header X-Forwarded-Prefix /mml;
    }

    # Redireciona caso o usuário esqueça da barra no final (evita o 404 do Traefik)
    location = /mml {
        return 301 $scheme://$host/mml/;
    }
}
